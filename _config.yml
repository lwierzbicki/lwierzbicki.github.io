# Willow Root Labs — the research/write-ups arm of Willow Root Security.
# Served at labs.willowrootsec.com. Brand tokens and design mirror the main
# site (willowrootsec.com); see docs/brand-visual.md in the willowrootsec repo.
#
# This file is NOT reloaded by `jekyll serve` — restart the server after edits.

# ── Identity (used by jekyll-seo-tag: <title>, meta description, Open Graph,
#    Twitter cards, and JSON-LD schema.org markup) ──────────────────────────
title: Willow Root Labs
tagline: "Security research, advisories & technical write-ups"
description: >- # ignore newlines until the next key
  Offensive security research by Lukasz Wierzbicki — vulnerability write-ups,
  coordinated advisories, and technical publications. The research arm of Willow
  Root Security, a boutique penetration testing consultancy.

# Required by jekyll-seo-tag for a valid canonical URL and absolute og:image.
url: "https://labs.willowrootsec.com"
baseurl: ""

# ── Author / organisation (drives the JSON-LD Person + Organization schema) ──
author:
  name: Lukasz Wierzbicki
  twitter: v13rs8a
logo: /apple-touch-icon.png

social:
  name: Lukasz Wierzbicki
  links:
    - https://www.linkedin.com/in/lwierzbicki
    - https://github.com/lwierzbicki
    - https://willowrootsec.com

linkedin_username: lwierzbicki
github_username: lwierzbicki
twitter_username: v13rs8a

# ── Analytics (GA4, consent-gated, production only) ──────────────────────────
# Rendered only when set AND jekyll.environment == 'production', and only after
# the visitor accepts (see _includes/google-analytics.html). This is the labs
# GA4 property (the main site willowrootsec.com uses a separate one).
google_analytics: G-RHZB7WVEJP

# ── Build ────────────────────────────────────────────────────────────────────
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Keep the raw pentest PoC assets and this config out of the built feed/pages.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
